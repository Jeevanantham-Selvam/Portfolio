<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title"></title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- ── All portfolio content lives in data.js ─────────────── -->
<script src="data.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth;}

body{
  font-family:'Poppins',sans-serif;
  background:#050816;
  color:white;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;
  width:100%;height:100%;
  background:
    radial-gradient(circle at top left,    rgba(139,92,246,.35), transparent 25%),
    radial-gradient(circle at bottom right,rgba(59,130,246,.25),  transparent 25%),
    radial-gradient(circle at center,      rgba(236,72,153,.18),  transparent 30%);
  z-index:-1;
  animation:bgmove 8s infinite alternate;
}
@keyframes bgmove{
  from{transform:scale(1);filter:blur(0px);}
  to  {transform:scale(1.1);filter:blur(25px);}
}

/* ── Nav ─────────────────────────────────────────────────── */
nav{
  position:fixed;top:0;width:100%;
  padding:20px 8%;
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(10px);
  z-index:1000;
}
.logo{
  font-size:28px;font-weight:700;
  background:linear-gradient(to right,#8b5cf6,#ec4899,#3b82f6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
nav a{margin-left:25px;text-decoration:none;color:white;transition:.3s;}
nav a:hover{color:#8b5cf6;}

/* ── Hero ────────────────────────────────────────────────── */
.hero{
  min-height:100vh;
  display:flex;justify-content:space-between;align-items:center;
  padding:120px 8%;gap:50px;
}
.hero-left{flex:1;}
.hero-left h1{font-size:72px;margin:15px 0;}
.hero-left h2{color:#8b5cf6;margin-bottom:20px;}
.hero-left p{color:#d1d5db;line-height:1.9;}
.tag{color:#ec4899;font-weight:600;}
.hero-buttons{display:flex;gap:20px;margin-top:40px;}

.btn{padding:15px 28px;border-radius:14px;text-decoration:none;font-weight:600;transition:.4s;}
.primary{background:linear-gradient(to right,#8b5cf6,#ec4899);color:white;}
.secondary{border:1px solid rgba(255,255,255,.2);color:white;}
.btn:hover{transform:translateY(-5px) scale(1.05);box-shadow:0 15px 40px rgba(139,92,246,.4);}

.hero-right{flex:1;display:flex;justify-content:center;position:relative;}
.glow{
  position:absolute;width:350px;height:350px;
  background:linear-gradient(to right,#8b5cf6,#ec4899,#3b82f6);
  filter:blur(90px);border-radius:50%;
}
.profile-card{
  width:320px;height:380px;border-radius:30px;
  background:rgba(255,255,255,.08);backdrop-filter:blur(15px);
  display:flex;justify-content:center;align-items:center;
  border:1px solid rgba(255,255,255,.1);
  z-index:1;animation:float 4s ease-in-out infinite;overflow:hidden;
}
.profile-card img{width:100%;height:100%;object-fit:fill;border-radius:30px;}
@keyframes float{
  0%  {transform:translateY(0px);}
  50% {transform:translateY(-20px);}
  100%{transform:translateY(0px);}
}

/* ── Sections ────────────────────────────────────────────── */
.section{padding:100px 8%;}
.section-title{
  font-size:42px;margin-bottom:60px;text-align:center;
  background:linear-gradient(to right,#8b5cf6,#ec4899,#3b82f6);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.card{
  background:rgba(255,255,255,.05);padding:35px;border-radius:24px;
  border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:25px;}

/* ── Cards ───────────────────────────────────────────────── */
.skill-card,.project-card,.app-card{
  background:rgba(255,255,255,.05);padding:30px;border-radius:24px;
  border:1px solid rgba(255,255,255,.08);
  transition:.4s;position:relative;overflow:hidden;
}
.skill-card:hover,.project-card:hover,.app-card:hover{
  transform:translateY(-12px);
  box-shadow:0 15px 40px rgba(139,92,246,.35);
}
.skill-card::before,.project-card::before,.app-card::before{
  content:'';position:absolute;top:0;left:0;height:5px;width:100%;
  background:linear-gradient(to right,#8b5cf6,#ec4899,#3b82f6);
}
.project-card p,.app-card p{line-height:1.8;color:#d1d5db;margin-top:10px;}
.app-logo{width:90px;height:90px;border-radius:24px;margin-bottom:20px;}
.app-buttons{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;}
.app-buttons a{
  padding:10px 16px;border-radius:12px;text-decoration:none;color:white;
  background:linear-gradient(to right,#8b5cf6,#3b82f6);font-size:14px;
}

/* ── Timeline ────────────────────────────────────────────── */
.timeline{border-left:3px solid #8b5cf6;padding-left:30px;}
.timeline-item{margin-bottom:40px;}
.timeline-item h3{color:#ec4899;}

/* ── Contact ─────────────────────────────────────────────── */
.contact-links{display:flex;flex-direction:column;gap:20px;margin-bottom:40px;}
.contact-links a{
  text-decoration:none;color:white;
  background:rgba(255,255,255,.05);padding:18px;border-radius:18px;transition:.3s;
}
.contact-links a:hover{
  background:linear-gradient(to right,#8b5cf6,#ec4899);
  transform:translateX(10px);
}
form{display:flex;flex-direction:column;gap:20px;}
input,textarea{
  padding:18px;border:none;border-radius:16px;
  background:rgba(255,255,255,.08);color:white;
  font-family:'Poppins',sans-serif;
}
textarea{min-height:140px;resize:none;}
button{
  padding:18px;border:none;border-radius:16px;
  background:linear-gradient(to right,#8b5cf6,#ec4899);
  color:white;font-weight:700;cursor:pointer;
}

/* ── Footer ──────────────────────────────────────────────── */
footer{
  padding:30px;text-align:center;
  border-top:1px solid rgba(255,255,255,.08);margin-top:50px;
}

/* ── Responsive ──────────────────────────────────────────── */
@media(max-width:900px){
  .hero{flex-direction:column;text-align:center;}
  .hero-left h1{font-size:52px;}
  nav{display:none;}
}
</style>
</head>
<body>

<!-- ── NAV ──────────────────────────────────────────────────── -->
<nav>
  <div class="logo" id="nav-logo"></div>
  <div id="nav-links"></div>
</nav>

<!-- ── HERO ─────────────────────────────────────────────────── -->
<section class="hero">
  <div class="hero-left">
    <p class="tag"  id="hero-tag"></p>
    <h1             id="hero-name"></h1>
    <h2             id="typing"></h2>
    <p              id="hero-bio"></p>
    <div class="hero-buttons" id="hero-buttons"></div>
  </div>
  <div class="hero-right">
    <div class="glow"></div>
    <div class="profile-card">
      <img id="hero-img" src="" alt="">
    </div>
  </div>
</section>

<!-- ── ABOUT ─────────────────────────────────────────────────── -->
<section class="section" id="about">
  <h2 class="section-title">About Me</h2>
  <div class="card">
    <p id="about-text" style="line-height:2;color:#d1d5db;white-space:pre-line;"></p>
  </div>
</section>

<!-- ── SKILLS ────────────────────────────────────────────────── -->
<section class="section" id="skills">
  <h2 class="section-title">Technical Skills</h2>
  <div class="grid" id="skills-grid"></div>
</section>

<!-- ── PROJECTS ──────────────────────────────────────────────── -->
<section class="section" id="projects">
  <h2 class="section-title">Key Projects</h2>
  <div class="grid" id="projects-grid"></div>
</section>

<!-- ── APPS ──────────────────────────────────────────────────── -->
<section class="section" id="apps">
  <h2 class="section-title">Published Applications</h2>
  <div class="grid" id="apps-grid"></div>
</section>

<!-- ── EXPERIENCE ────────────────────────────────────────────── -->
<section class="section">
  <h2 class="section-title">Experience</h2>
  <div class="timeline" id="timeline"></div>
</section>

<!-- ── CONTACT ───────────────────────────────────────────────── -->
<section class="section" id="contact">
  <h2 class="section-title">Contact Me</h2>
  <div class="card">
    <div class="contact-links" id="contact-links"></div>
    <!-- <form id="contact-form">
      <input  type="text"  placeholder="Your Name"    required>
      <input  type="email" placeholder="Your Email"   required>
      <textarea            placeholder="Your Message"></textarea>
      <button type="submit">Send Message 🚀</button>
    </form> -->
    <form id="contact-form">
  <input type="hidden" name="access_key" value="6d0ccd02-9c24-421c-b61e-54ffa9cd95b7">

  <input
    type="text"
    name="name"
    placeholder="Your Name"
    required
  >

  <input
    type="email"
    name="email"
    placeholder="Your Email"
    required
  >

  <textarea
    name="message"
    placeholder="Your Message"
    required
  ></textarea>

  <button type="submit">Send Message 🚀</button>
</form>

<script>
document
  .getElementById("contact-form")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    const form = e.target;
    const data = new FormData(form);

    const response = await fetch(
      "https://api.web3forms.com/submit",
      {
        method: "POST",
        body: data
      }
    );

    const result = await response.json();

    if (result.success) {
      alert("Message sent successfully 🚀");
      form.reset();
    } else {
      alert("Something went wrong");
    }
});
</script>
  </div>
</section>

<!-- ── FOOTER ────────────────────────────────────────────────── -->
<footer id="footer"></footer>

<!-- ── RENDERER ──────────────────────────────────────────────── -->
<script>
(function render() {
  const d = portfolioData;  // from data.js

  // Page title
  document.getElementById("page-title").textContent =
    `${d.name} | ${d.tag}`;

  // Nav
  document.getElementById("nav-logo").textContent = d.logo;
  document.getElementById("nav-links").innerHTML =
    d.navLinks.map(l => `<a href="${l.href}">${l.label}</a>`).join("");

  // Hero
  document.getElementById("hero-tag").textContent  = d.tag;
  document.getElementById("hero-name").textContent = d.name;
  document.getElementById("hero-bio").textContent  = d.bio;
  document.getElementById("hero-img").src          = d.profileImage;
  document.getElementById("hero-img").alt          = d.profileImageAlt;
  document.getElementById("hero-buttons").innerHTML =
    d.heroButtons.map(b =>
      `<a href="${b.href}" class="btn ${b.style}">${b.label}</a>`
    ).join("");

  // Typing animation
  let i = 0;
  const el = document.getElementById("typing");
  (function type() {
    if (i < d.typingText.length) {
      el.innerHTML += d.typingText.charAt(i++);
      setTimeout(type, 50);
    }
  })();

  // About
  document.getElementById("about-text").textContent = d.about;

  // Skills
  document.getElementById("skills-grid").innerHTML =
    d.skills.map(s => `
      <div class="skill-card">
        <h3>${s.title}</h3>
        <p>${s.description}</p>
      </div>`
    ).join("");

  // Projects
  document.getElementById("projects-grid").innerHTML =
    d.projects.map(p => `
      <div class="project-card">
        <h3>${p.title}</h3>
        <p>${p.description}</p>
      </div>`
    ).join("");

  // Apps
  document.getElementById("apps-grid").innerHTML =
    d.apps.map(a => `
      <div class="app-card">
        <img src="${a.logo}" class="app-logo" alt="${a.title} logo">
        <h3>${a.title}</h3>
        <p>${a.description}</p>
        <div class="app-buttons">
          ${a.links.map(l => `<a href="${l.href}">${l.label}</a>`).join("")}
        </div>
      </div>`
    ).join("");

  // Experience
  document.getElementById("timeline").innerHTML =
    d.experience.map(e => `
      <div class="timeline-item">
        <h3>${e.role}</h3>
        <h4>${e.company}</h4>
        <p>${e.period}</p><br>
        <p>${e.description}</p>
      </div>`
    ).join("");

  // Contact links
  const c = d.contact;
  document.getElementById("contact-links").innerHTML = `
    <a href="tel:${c.phone}">📞 ${c.phone}</a>
    <a href="mailto:${c.email}">📧 ${c.email}</a>
    <a href="${c.linkedin}" target="_blank">💼 LinkedIn</a>
    <a href="${c.github}"   target="_blank">🐙 GitHub</a>
  `;

  // Contact form action
  document.getElementById("contact-form").action = c.formAction;
  document.getElementById("contact-form").method = "POST";

  // Footer
  document.getElementById("footer").textContent = d.footerText;
})();
</script>

</body>
</html>
